# vexis-agent — user-declared MCP servers.
#
# Copy to ~/.vexis/mcp-servers.yaml (or $VEXIS_HOME/mcp-servers.yaml)
# and add entries for each MCP server you want vexis to wire into the
# workspace MCP config. Run `vexis-agent setup` (or
# `vexis-agent service restart`) so the brain picks them up.
#
# Each entry is EITHER a local stdio server (`command`) OR a remote
# HTTP server (`url`) — exactly one of the two. The wizard skips any
# stdio entry whose `binary` isn't on PATH, so you can declare
# aspirational entries without breaking anything. Remote entries have
# no binary, so that check doesn't apply to them.

servers: []

# ── Local stdio servers ────────────────────────────────────────────
# Spawned as a local process; vexis talks to them over stdio.
#
# servers:
#   # Direct binary, no args.
#   - name: my-tool
#     command: my-tool
#     args: []
#
#   # Tool that runs via a launcher (npx / pipx run / uvx / cargo run).
#   # The `binary` field is the PATH check; defaults to `command`.
#   - name: my-launched-tool
#     binary: npx
#     command: npx
#     args: ["-y", "some-mcp-package"]
#
#   # Tool that needs per-server env (API keys, config paths, etc.).
#   - name: my-tool-with-env
#     command: my-tool
#     args: ["--mcp"]
#     env:
#       MY_TOOL_API_KEY: "..."
#       MY_TOOL_CONFIG: "~/.config/my-tool/cfg"

# ── Remote HTTP servers ────────────────────────────────────────────
# Reached over the network at a URL — no local binary to install.
#
# `transport` is optional: "http" (Streamable HTTP, the default) or
# "sse". `headers` are sent on every request — typically an
# Authorization bearer token.
#
# Header values support ${ENV_VAR} interpolation, resolved from the
# environment when the native config files are written. Prefer this
# over pasting a raw token: keep the secret in the environment (or
# vexis's .env) and reference it as ${MY_TOKEN}. An unset variable is
# left literal so a missing token fails loudly instead of silently
# becoming an empty header.
#
# servers:
#   # Minimal remote server, no auth.
#   - name: my-remote
#     url: https://mcp.example.com/
#
#   # Remote server with a bearer token from the environment.
#   - name: my-authed-remote
#     url: https://mcp.example.com/
#     transport: http
#     headers:
#       Authorization: "Bearer ${MY_REMOTE_TOKEN}"

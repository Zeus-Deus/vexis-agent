name: browser
version: 1.0.0
description: "Stealth web browsing — drives a Camoufox (hardened Firefox) session, exposed to the brain as the `vexis-browser` MCP server (with the `vexis-browse` CLI as a back-compat front-end). The flagship add-on: navigate/snapshot/click/read/type/press/back/scroll/screenshot/recycle, persistent login profiles, Cloudflare auto-solve, and a pluggable CapSolver/2Captcha layer. Because the brain reaches it over MCP, any other browser MCP server is a config-level drop-in replacement — no daemon edit, no release."
author: "Zeus-Deus"
kind: standalone

requires:
  vexis_agent: ">=0.9.0"
  python: ">=3.11"

provides:
  # The brain's primary interface: the vexis-browser stdio MCP server
  # (vexis-browser-mcp console script). Folded into both brains' native
  # MCP config at startup via register_mcp_server_default.
  mcp_server_defaults: ["vexis-browser"]
  # The engine behind the MCP server AND the back-compat vexis-browse
  # CLI — both forward to these handlers over the control socket.
  dispatch_handlers:
    - browser_navigate
    - browser_snapshot
    - browser_click
    - browser_read
    - browser_type
    - browser_press
    - browser_back
    - browser_scroll
    - browser_screenshot
    - browser_recycle
  background_tasks: ["browser-session-lifecycle"]
  skills: ["browser.md"]

# Config back-compat: every knob also reads the legacy top-level
# ``[browser]`` block when ``addons.browser.*`` is unset, so existing
# user configs keep working with no edit. See __init__.py
# ``_browser_config_overrides`` and tools/browser/profile.py.
config_schema:
  profiles_dir:
    type: str
    description: "Directory holding Camoufox profiles. Default ~/.vexis/browser-profiles. Legacy: [browser].profiles_dir."
  default_profile:
    type: str
    default: default
    description: "Profile name used for the live session. Legacy: [browser].default_profile."
  headless:
    type: bool
    default: true
    description: "Run headless (no window). Default true — a laptop-as-home-server has no usable display. Legacy: [browser].headless."
  inactivity_timeout_seconds:
    type: int
    default: 120
    description: "Idle window before the session is recycled. Legacy: [browser].inactivity_timeout_seconds."
  action_timeout_seconds:
    type: int
    default: 120
    description: "Per-action wall-clock timeout. Legacy: [browser].action_timeout_seconds."
  navigation_timeout_seconds:
    type: int
    default: 30
    description: "Per-navigation budget (goto + load + networkidle settle). Bounded short and separate from action_timeout_seconds so a socket-heavy page can't stall a navigation. Legacy: [browser].navigation_timeout_seconds."
  navigation_timeout_recycle_threshold:
    type: int
    default: 3
    description: "Consecutive navigation timeouts that force-recycle a wedged session. A wedged engine returns Page.goto timeouts back-to-back while the host answers fine, and the inactivity recycler never fires because a failing navigate still counts as activity; this trips a recycle instead. 0 disables. Legacy: [browser].navigation_timeout_recycle_threshold."
  solve_cloudflare:
    type: bool
    default: true
    description: "Auto-solve Cloudflare challenges on navigate. Legacy: [browser].solve_cloudflare."
  captcha_solver:
    type: str
    default: none
    description: "Paid captcha provider: none | capsolver | twocaptcha. Legacy: [browser].captcha_solver."
  captcha_solver_api_key:
    type: str
    description: "API key for the selected captcha provider. Legacy: [browser].captcha_solver_api_key."
  screenshot_include_base64:
    type: bool
    default: false
    description: "Include image_base64 in screenshot results by default. Legacy: [browser].screenshot_include_base64."

# vexis-agent — example configuration.
#
# Copy to ~/.vexis/config.yaml (or $VEXIS_HOME/config.yaml) and edit.
# Every block below is optional: a missing file → all defaults; a
# malformed file → warning + defaults. The canonical schema lives in
# vexis_agent/core/yaml_config.py — keep these two in sync.
#
# Secrets (Telegram bot token, allowed user ID, provider API keys)
# go in ~/.vexis/.env, NOT here. See .env.example.

# ── brain abstraction (Phase C, see docs/brains.md) ─────────────────
brain:
  kind: claude-code            # or "opencode" or "null". Selects which
                               # agent CLI vexis spawns under. Switching
                               # to opencode requires the legacy-keys →
                               # tier-schema migration in docs/migration.md.
  file_mutation_footer: true   # Snapshot the workspace before and
                               # after every brain turn and inject a
                               # "[turn-N verifier] Files changed last
                               # turn: ..." block at the top of the next
                               # user message. Lets the model self-
                               # correct against silent write failures
                               # ("I edited foo.py" when no such edit
                               # happened). Set false on pathologically
                               # large workspaces where the snapshot
                               # walk (~50 ms for 10k files) is too slow.
                               # Reads disk per turn — toggling takes
                               # effect on the next turn, no restart.

# ── memory limits ───────────────────────────────────────────────────
memory:
  memory_char_limit: 2200
  user_char_limit: 1375

# ── learning curator ────────────────────────────────────────────────
curator:
  enabled: true
  interval_hours: 168
  min_idle_hours: 2
  stale_after_days: 30
  archive_after_days: 90

# ── per-subsystem model selection ───────────────────────────────────
# Subsystems pick an abstract tier (tiny/small/medium/large); the
# active brain translates tier → native model id via the tiers map
# below or its built-in defaults. Foreground turns never pass a
# --model flag (sentinel "default") unless overridden by voice call
# mode. See docs/model-ux.md for the resolution table.
models:
  # Foreground (chat) model — the one you talk to. tier-or-raw;
  # `default`/unset = the brain's account default (no --model flag).
  # Set via `/model set foreground` or the dashboard Models tab.
  brain: default
  subsystems:
    learning_review: small
    learning_triage: tiny
    coherence_judge: small
    relationships_extractor: medium
    relationships_classifier: tiny
    goal_judge: large
    curator: small
  tiers:
    claude-code:
      large: sonnet
    opencode:
      large: anthropic/claude-sonnet-4
      medium: anthropic/claude-sonnet-3-7

# ── goals (v3d, see docs/goals.md) ──────────────────────────────────
goals:
  enabled: true
  max_turns: 20

# ── relationships (v3c, see docs/relationships.md) ──────────────────
relationships:
  explicit_consent_enabled: false
  approval_hint_enabled: true

# ── codemux orchestration watcher (see vexis_agent/addons/codemux/docs/codemux-watcher.md) ─────
# Active ONLY when the `codemux` MCP is wired into mcp-servers.yaml;
# otherwise the entire section is ignored.
#
#   poll_interval_seconds      — how often the watcher reads each
#                                workspace's terminal scrollback.
#                                Default 5.0; range [1.0, 300.0].
#                                Worst-case notify latency is
#                                idle_after_seconds + this.
#   oscillation_window_seconds — debounce: a second idle transition
#                                inside this window of the previous
#                                one flips the status but suppresses
#                                the Telegram ping. Default 60.0;
#                                range [0.0, 3600.0]. Set to 0 to
#                                disable debounce.
#
# Changes take effect on daemon restart.
watcher:
  poll_interval_seconds: 5.0
  oscillation_window_seconds: 60.0
